controllers:
  resource:
    path: ../src/Controller/
    namespace: EtoA\Controller
  type: attribute

index:
  path: /
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
  defaults:
    route: game.index
    permanent: true
    keepQueryParams: true

game.index:
  path: /game
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
  defaults:
    route: game.overview
    permanent: true
    keepQueryParams: true

admin.index:
  path: /admin
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
  defaults:
    route: 'admin.overview'
    permanent: true
    keepQueryParams: true
    keepRequestMethod: true
    ignoreAttributes: true

live_component_game:
  path: /game/_components/{_live_component}/{_live_action}
  defaults:
    _live_action: 'get'