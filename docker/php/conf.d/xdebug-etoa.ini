; Replaces vagrant/xdebug.ini. The client host was 192.168.33.1 there, which was
; the host as seen from the virtualbox private network; in compose it is the gateway
; that extra_hosts maps for us.
;
; The mode is off by default, because an always-on xdebug costs real time on every
; request. Switch it on for a session without rebuilding:
;
;   XDEBUG_MODE=debug docker compose up -d php
;
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes
xdebug.discover_client_host = false
xdebug.idekey = etoa
