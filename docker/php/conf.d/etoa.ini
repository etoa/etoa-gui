; Development settings. The vagrant box used the distribution defaults, these are
; the few that actually matter for this application.

memory_limit = 512M
max_execution_time = 120

; the game posts large forms (shipyard, defense, population)
post_max_size = 16M
upload_max_filesize = 16M
max_input_vars = 5000

date.timezone = Europe/Zurich

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; opcache with revalidation, so edits in the bind mount are picked up
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
