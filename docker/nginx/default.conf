server {
    listen 80;
    server_name _;

    root /app/public;

    # The vagrant config also routed /_profiler|/api|/admin|... to a symfony.php
    # front controller. That file does not exist any more, everything goes through
    # index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # the game builds large forms, the default 4k header buffer is not enough
        fastcgi_read_timeout 120s;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    # no other php file is a valid entry point
    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 16m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
